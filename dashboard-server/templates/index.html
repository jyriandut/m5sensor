<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pressure Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe5;
      --ink: #151515;
      --card: #fffaf0;
      --accent: #c03d1e;
      --grid: rgba(21, 21, 21, 0.15);
      --muted: #746a5f;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Gill Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 10% 10%, #fff4d6, var(--bg));
    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .panel {
      width: min(720px, 96vw);
      background: var(--card);
      border: 2px solid var(--ink);
      box-shadow: 12px 14px 0 rgba(0, 0, 0, 0.1);
      padding: 28px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }
    .value-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 18px;
    }
    .value {
      font-size: 56px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .unit {
      font-size: 18px;
      color: var(--muted);
    }
    .meta {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .chart-wrap {
      border: 1px solid var(--grid);
      padding: 12px;
      background: #fffdfa;
    }
    .actions {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border: 2px solid var(--ink);
      background: var(--accent);
      color: #fffaf0;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .button:hover {
      filter: brightness(0.95);
    }
    canvas {
      display: block;
      width: 100%;
      height: 220px;
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>M5 Pressure Sensor</h1>
      <div class="value-row">
        <div id="pressure-value" class="value">
          {% if pressure.value is not none %}{{ pressure.value }}{% else %}--{% endif %}
        </div>
        <div class="unit">kPa</div>
      </div>
      <div class="meta">
        Last update: <span id="pressure-time">
          {% if pressure.timestamp %}{{ pressure.timestamp }}{% else %}waiting for data{% endif %}
        </span>
      </div>
      <div class="chart-wrap">
        <canvas id="pressure-chart"></canvas>
      </div>
      <div class="actions">
        <a class="button" href="/export">Download CSV</a>
      </div>
    </div>
  </main>
  <script>
    const chart = document.getElementById("pressure-chart");
    const ctx = chart.getContext("2d");
    const points = [];
    const maxPoints = 120;

    function resizeCanvas() {
      const rect = chart.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      chart.width = Math.floor(rect.width * scale);
      chart.height = Math.floor(rect.height * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    }

    function drawChart() {
      const width = chart.getBoundingClientRect().width;
      const height = chart.getBoundingClientRect().height;
      ctx.clearRect(0, 0, width, height);

      ctx.strokeStyle = "rgba(21, 21, 21, 0.15)";
      ctx.lineWidth = 1;
      for (let i = 1; i < 5; i += 1) {
        const y = (height / 5) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      if (points.length < 2) {
        return;
      }

      const values = points.map((p) => p.value);
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        min -= 1;
        max += 1;
      }
      const padding = (max - min) * 0.1;
      min -= padding;
      max += padding;

      ctx.strokeStyle = "#c03d1e";
      ctx.lineWidth = 2;
      ctx.beginPath();
      points.forEach((point, idx) => {
        const x = (width / (maxPoints - 1)) * idx;
        const normalized = (point.value - min) / (max - min);
        const y = height - normalized * height;
        if (idx === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
    }

    async function fetchPressure() {
      try {
        const resp = await fetch("/api/pressure");
        const data = await resp.json();
        const valueEl = document.getElementById("pressure-value");
        const timeEl = document.getElementById("pressure-time");
        if (data.value === null || data.value === undefined) {
          valueEl.textContent = "--";
          timeEl.textContent = "waiting for data";
          return;
        }
        valueEl.textContent = data.value;
        timeEl.textContent = data.timestamp || "just now";
        points.push({ value: Number(data.value), ts: Date.now() });
        if (points.length > maxPoints) {
          points.shift();
        }
        drawChart();
      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      drawChart();
    });

    resizeCanvas();
    fetchPressure();
    setInterval(fetchPressure, 1000);
  </script>
</body>
</html>
