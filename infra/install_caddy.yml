---
- name: Install and configure Caddy reverse proxy
  hosts: vpn_server
  become: true
  gather_facts: true

  vars:
    caddy_bind_ip: "10.8.0.1"
    caddy_dashboard_upstream: "127.0.0.1:8000"
    caddy_esp_upstream: "10.8.0.2:8080"
    cert_fullchain: "/etc/letsencrypt/live/narbot.ee/fullchain.pem"
    cert_privkey: "/etc/letsencrypt/live/narbot.ee/privkey.pem"

  tasks:
    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    - name: Ensure Caddyfile is configured
      ansible.builtin.copy:
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
        content: |
          hello.narbot.ee:443 {
            bind {{ caddy_bind_ip }}
            tls {{ cert_fullchain }} {{ cert_privkey }}
            reverse_proxy {{ caddy_dashboard_upstream }}
          }

          dashboard.narbot.ee:443 {
            bind {{ caddy_bind_ip }}
            tls {{ cert_fullchain }} {{ cert_privkey }}
            reverse_proxy {{ caddy_dashboard_upstream }}
          }

          esp.narbot.ee:443 {
            bind {{ caddy_bind_ip }}
            tls {{ cert_fullchain }} {{ cert_privkey }}
            reverse_proxy {{ caddy_esp_upstream }}
          }
      notify:
        - Reload caddy

    - name: Ensure caddy service is enabled and running
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started

  handlers:
    - name: Reload caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded
