<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <link rel="stylesheet" href="pico.lime.min.css" />
  <script src="chart.umd.min.js" defer></script>
  <script src="alpine.min.js" defer></script>
  <script src="main.js"></script>
  <title>M5 Atom: Pressure sensor interface</title>
  <style>
    /* Make the chart nicely visible */
    #chartWrap { height: 280px; }
  </style>
</head>
<body data-theme="light">
  <main class="container" x-data="pressure" x-init="init()">
    <header class="grid">
      <h1>Live Pressure</h1>
    </header>
    <section id="token" x-show="!hasToken()">
      <div>
        <label>Token</label>
        <input type="password" x-model="token" />
        <button
            @click="saveToken"
            :aria-busy="busy"
            :disabled="busy"
         >Save token</button>
      </div>      
    </section>
    <div x-show="hasToken()">
      <!-- <section id="chartWrap" style="height:280px"> -->
      <!--   <canvas x-ref="chart" width="800" height="280"></canvas> -->
      <!-- </section> -->
      <footer>
        <small>Last value: <strong x-text="pressureValue"></strong> kPa</small>
      </footer>
    </div>
    
  </main>
</body>
</html>
